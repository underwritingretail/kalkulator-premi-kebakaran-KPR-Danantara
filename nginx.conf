server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Endpoint for container orchestration health checks.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Static assets have content hashes in their filenames after the Vite build.
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Keep React routes working when opened or refreshed directly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
